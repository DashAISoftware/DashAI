name: Pre-commit checks
# `push` alone only covers branches that live in this repository, so a pull
# request from a fork never ran these hooks and its lint errors surfaced on
# develop after the merge instead of on the PR. `pull_request` covers forks;
# internal branches keep firing once, GitHub deduplicates the two events.
on:
  push:
  pull_request:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository code"
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          cache: "yarn"
          cache-dependency-path: DashAI/front/yarn.lock

      - name: Install frontend deps
        working-directory: DashAI/front
        run: yarn install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Pillow goes to the system Python because the institutions-readme-sync
      # hook is `language: system` and runs `python scripts/render_institutions.py`.
      - name: Install pre-commit
        run: uv pip install --system pre-commit Pillow

      - name: Cache pre-commit
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files
