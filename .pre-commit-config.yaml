repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: "DashAI/front/tsconfig.json"
      - id: check-xml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff
        args: [--fix, "--show-fixes"]
        exclude: "DashAI/back/dependencies/database/migrate\\.py|scripts/ci_alembic_check\\.py"
      - id: ruff-format
        exclude: "DashAI/back/dependencies/database/migrate\\.py|scripts/ci_alembic_check\\.py"
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8"
    hooks:
      - id: prettier
        files: \.[jt]sx?$ # *.js, *.jsx, *.ts, *.tsx
        types: [file]
        args:
          - "--config=DashAI/front/.prettierrc"
          - "--ignore-path=DashAI/front/.prettierignore"

  - repo: local
    hooks:
      - id: institutions-readme-sync
        name: institutions readme sync
        entry: python scripts/render_institutions.py --check
        language: system
        files: "docs/static/institutions/institutions\\.json|README\\.rst|scripts/render_institutions\\.py"
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: yarn lint
        language: system
        types: [javascript, jsx, ts, tsx]

exclude: "(migrations|generated)/.*"
